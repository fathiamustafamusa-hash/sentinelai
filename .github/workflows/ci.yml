name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Backend: Lint + Tests + Coverage
  # ============================================================
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry==2.1.4

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: src/backend/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('src/backend/pyproject.toml', 'src/backend/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Lint with Ruff
        run: poetry run ruff check app

      - name: Format check with Ruff
        run: poetry run ruff format --check app
        continue-on-error: true

      - name: Type check with mypy
        run: poetry run mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          poetry run pytest tests/ \
            -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=75

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: src/backend/coverage.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: src/backend/coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================================
  # Docker: Build sanity check
  # ============================================================
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: false
          load: true
          tags: sentinelai-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs
        run: |
          docker run --rm sentinelai-backend:ci python -c "from app.main import app; print('OK')"

  # ============================================================
  # Security Scanning: Bandit + pip-audit + Trivy
  # ============================================================
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry==2.1.4

      - name: Install dependencies
        working-directory: src/backend
        run: |
          poetry config virtualenvs.create false
          poetry install --no-root

      # ---------- Bandit: Python SAST ----------
      - name: Run Bandit (Python SAST)
        working-directory: src/backend
        run: |
          pip install bandit[toml]
          bandit -r app -c pyproject.toml -f screen -ll
        continue-on-error: false

      # ---------- pip-audit: Dependency vulnerabilities ----------
      - name: Run pip-audit (dependency CVEs)
        working-directory: src/backend
        run: |
          pip install pip-audit
          pip-audit --desc --strict || true
        continue-on-error: true

      # ---------- Trivy: Docker image scan ----------
      - name: Build Docker image for scanning
        run: |
          docker build -t sentinelai-backend:scan -f src/backend/Dockerfile src/backend

      - name: Run Trivy (Docker image CVEs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'sentinelai-backend:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
