# =============================================================
# SentinelAI - Production Deployment
# =============================================================
# This file extends docker-compose.yml with production overrides.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  redis:
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  backend:
    restart: always
    environment:
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
      replicas: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery-worker:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
      replicas: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx reverse proxy (exposes only 80/443)
  nginx:
    image: nginx:1.27-alpine
    container_name: sentinel-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - sentinel-network
