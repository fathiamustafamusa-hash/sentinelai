[tool.poetry]
name = "sentinelai-backend"
version = "0.1.0"
description = "SentinelAI SOC Backend API"
authors = ["Mustafa Musa <fathiamustafamusa@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = "^2.0.35"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.10"
redis = "^5.2.0"
python-dotenv = "^1.0.1"
email-validator = "^2.2.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "^4.2.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
celery = {extras = ["redis"], version = "^5.4.0"}
flower = "^2.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.27.0"
ruff = "^0.7.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ============================================================
# Ruff - Linter & Formatter
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    ".git",
    "build",
    "dist",
]

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, I: isort, N: pep8-naming
# UP: pyupgrade, B: flake8-bugbear, C4: flake8-comprehensions
# SIM: flake8-simplify, S: bandit-style security checks
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "S"]
ignore = [
    "S101",   # assert (allowed in tests)
    "E501",   # line too long (handled by formatter)
    "B008",   # FastAPI pattern: Depends() in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]              # Allow asserts & hardcoded passwords in tests
"app/config.py" = ["S104"]                         # Allow binding to 0.0.0.0
"app/services/auth_service.py" = ["S106"]          # token_type="bearer" is not a password

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ============================================================
# MyPy - Static Type Checker
# ============================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
strict_equality = true
ignore_missing_imports = true
exclude = [
    "tests/",
    ".venv/",
]

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=75",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ============================================================
# Coverage
# ============================================================
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/config.py",
    "*/celery_app.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ============================================================
# Bandit - Python Security Linter
# ============================================================
[tool.bandit]
exclude_dirs = ["tests", ".venv", "__pycache__"]
skips = [
    "B101",  # assert_used (allowed in tests)
]
